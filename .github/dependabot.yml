version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint (via eslint-config-next) doesn't support TS 7 yet
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
